<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employees | PharmaCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container">
    <div class="card">
        <h1>Employee Management (Admin)</h1>
        <table>
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Position</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="e : ${employees}">
                <td th:text="${e.name}">Name</td>
                <td th:text="${e.email}">Email</td>
                <td th:text="${e.phone}">Phone</td>
                <td th:text="${e.position}">Position</td>
                <td>
                    <span th:if="${e.active}" class="badge badge-success">Active</span>
                    <span th:unless="${e.active}" class="badge badge-danger">Inactive</span>
                </td>
                <td>
                    <form th:if="${e.active}" th:action="@{/employees/{id}/deactivate(id=${e.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-warning" style="padding:5px 10px;font-size:12px;">Deactivate</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="card" style="max-width:480px;">
        <h2>Add New Employee</h2>
        <form th:action="@{/employees/save}" th:object="${employee}" method="post">
            <div class="form-group"><label>Name</label><input type="text" th:field="*{name}" required></div>
            <div class="form-group"><label>Email</label><input type="email" th:field="*{email}"></div>
            <div class="form-group"><label>Phone</label><input type="text" th:field="*{phone}"></div>
            <div class="form-group"><label>Position</label><input type="text" th:field="*{position}" placeholder="e.g. Pharmacist, Cashier"></div>
            <button type="submit" class="btn">Add Employee</button>
        </form>
    </div>
</div>
<div th:replace="~{fragments/chatbot :: chatbot}"></div>
</body>
</html>
