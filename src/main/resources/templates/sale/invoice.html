<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Invoice | PharmaCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        @media print { .navbar, .no-print { display:none; } }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}" class="no-print"></div>
<div class="container">
    <div class="card" id="invoice-box">
        <div style="text-align:center; margin-bottom:20px;">
            <h1 style="margin-bottom:0;">PharmaCare Pharmacy</h1>
            <p style="color:#64748b; margin-top:4px;">Store ID: PHC-001 &nbsp;|&nbsp; INVOICE</p>
        </div>

        <p><b>Invoice No:</b> <span th:text="'INV-' + ${sale.id}">INV-1</span></p>
        <p><b>Date:</b> <span th:text="${sale.saleDate}">2026-08-12</span></p>
        <p><b>Customer:</b> <span th:text="${sale.customerName}">Customer</span>
           <span th:if="${sale.customerPhone}" th:text="'(' + ${sale.customerPhone} + ')'"></span></p>
        <p><b>Served By:</b> <span th:text="${sale.soldBy.fullName}">Pharmacist</span></p>

        <table>
            <thead><tr><th>Medicine</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr></thead>
            <tbody>
            <tr th:each="item : ${sale.items}">
                <td th:text="${item.medicine.name}">Med</td>
                <td th:text="${item.quantity}">1</td>
                <td th:text="'₹' + ${item.unitPrice}">0</td>
                <td th:text="'₹' + ${item.quantity * item.unitPrice}">0</td>
            </tr>
            </tbody>
        </table>

        <h2 style="text-align:right; margin-top:16px;">Total: ₹<span th:text="${sale.totalAmount}">0</span></h2>

        <div class="no-print" style="margin-top:20px; display:flex; gap:10px;">
            <button onclick="window.print()" class="btn">&#128424;&#65039; Print Invoice</button>
            <a th:href="@{/sales/checkout}" class="btn" style="background:#64748b;">New Sale</a>
        </div>
    </div>
</div>
</body>
</html>
