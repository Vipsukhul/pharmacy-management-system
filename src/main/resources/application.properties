spring.application.name=pharmacy-management-system
spring.config.import=optional:file:.env[.properties]

# ---- MySQL Database ----
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/pharmacy_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Server Port ----
server.port=${SERVER_PORT:${PORT:8080}}

# ---- Initial Default Admin Account ----
app.default-admin.username=${ADMIN_USERNAME:admin}
app.default-admin.password=${ADMIN_PASSWORD}
app.default-admin.email=${ADMIN_EMAIL}


